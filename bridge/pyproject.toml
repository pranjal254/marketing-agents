[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "c2c-bridge"
version = "0.1.0"
description = "Local dev bridge: exposes the Campaign Identification agent over HTTP + SSE for the Marketing Studio UI (plays Execution Studio's role in dev)"
requires-python = ">=3.12"
dependencies = [
    "shiftai-shared>=0.1.0",
    "campaign-identification-agent>=0.1.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
c2c_bridge = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
mypy_path = "src"
packages = ["c2c_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
