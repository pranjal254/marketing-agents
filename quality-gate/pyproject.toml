[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quality-gate-agent"
version = "0.1.0"
description = "LevelShift Content-to-Campaign Phase 1 — Agent 5: Quality Gate & Approval (deterministic rules pass + contextual compliance checks + human approval routing; flags and blocks, never edits; humans approve)"
requires-python = ">=3.12"
dependencies = [
    "shiftai-shared>=0.1.0",
    "campaign-in-a-box-agent>=0.1.0",
    "content-repurposing-agent>=0.1.0",
    "pydantic>=2.7",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
c2c_quality_gate = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
mypy_path = "src"
packages = ["c2c_quality_gate"]

[[tool.mypy.overrides]]
module = ["docx", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
