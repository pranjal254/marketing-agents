[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftai-shared"
version = "0.1.0"
description = "Shared components for LevelShift Content-to-Campaign agents: LLM providers, M365 connectors, STS v2 telemetry, control plane, context store"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "jsonschema>=4.21",
    "httpx>=0.27",
    "msal>=1.28",
    "anthropic>=0.34",
    "openai>=1.35",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]
# Postgres Context Store binding (staging/prod). Agents never import psycopg;
# only deployments that set DATABASE_URL install this extra.
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shiftai_shared = ["templates/*.md", "brand/*.json", "context_store/migrations/*.sql", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
mypy_path = "src"
packages = ["shiftai_shared"]

[[tool.mypy.overrides]]
module = ["msal", "msal.*", "docx", "docx.*", "jsonschema", "jsonschema.*", "psycopg", "psycopg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
